<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Cidade Conecta</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B0F17;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
  }
  .card {
    background: #131926;
    border: 1px solid #232c3d;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #9aa4b8; font-size: 14px; margin: 0 0 28px; line-height: 1.5; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 20px;
    background: #5865F2;
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: background .15s ease;
  }
  .btn:hover { background: #4752c4; }
  .status {
    margin-top: 20px;
    font-size: 14px;
    color: #9aa4b8;
    min-height: 20px;
  }
  .user {
    margin-top: 24px;
    display: none;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .user img { width: 40px; height: 40px; border-radius: 50%; }
  .user span { font-weight: 600; }
  .logout {
    margin-top: 16px;
    background: none;
    border: 1px solid #2a3346;
    color: #9aa4b8;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Cidade Conecta</h1>
    <p>Entre com sua conta do Discord para acompanhar suas compras e status VIP.</p>

    <a class="btn" id="discordLoginBtn" href="#">
      Entrar com Discord
    </a>

    <div class="user" id="userBox">
      <img id="userAvatar" src="" alt="">
      <span id="userName"></span>
    </div>
    <button class="logout" id="logoutBtn">Sair</button>

    <div class="status" id="status"></div>
  </div>

<script>
  // Troque pelo domínio real da sua API (o mesmo que você usou no Railway).
  const API_URL = "https://api-production-bc755.up.railway.app";

  const params = new URLSearchParams(location.search);
  const statusEl = document.getElementById('status');
  const loginBtn = document.getElementById('discordLoginBtn');
  const userBox = document.getElementById('userBox');
  const logoutBtn = document.getElementById('logoutBtn');

  // pra onde o backend deve mandar o usuário de volta depois de logar
  const voltar = params.get('voltar') || '/site/login.html';
  loginBtn.href = API_URL + '/auth/discord?voltar=' + encodeURIComponent(voltar);

  if (params.get('login') === 'ok') {
    statusEl.textContent = 'Login realizado com sucesso!';
  } else if (params.get('login') === 'erro') {
    statusEl.textContent = 'Não foi possível entrar. Tente novamente.';
  }

  fetch(API_URL + '/auth/me', { credentials: 'include' })
    .then(r => r.ok ? r.json() : null)
    .then(usuario => {
      if (usuario) {
        loginBtn.style.display = 'none';
        userBox.style.display = 'flex';
        logoutBtn.style.display = 'inline-block';
        document.getElementById('userName').textContent = usuario.global_name || usuario.username;
        if (usuario.avatar) document.getElementById('userAvatar').src = usuario.avatar;
      }
    })
    .catch(() => {});

  logoutBtn.addEventListener('click', function () {
    fetch(API_URL + '/auth/logout', { method: 'POST', credentials: 'include' })
      .then(() => location.reload());
  });
</script>
</body>
</html>
